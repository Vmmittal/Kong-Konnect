name: APIOps - Deploy OpenAPI to Kong Konnect

on:
  push:
    branches:
      - main
    paths:
      - 'open-api.yaml'
      - '.github/workflows/kong-deployment.yml'

jobs:
  deploy-to-konnect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install inso
        uses: kong/setup-inso@v2
        with:
          inso-version: 10.3.1  # Use a stable version

      - name: Install decK
        run: |
          echo "Downloading decK..."
          curl -sL https://github.com/kong/deck/releases/download/v1.34.0/deck_1.34.0_linux_amd64.tar.gz -o deck.tar.gz
          tar -zxvf deck.tar.gz deck
          sudo mv deck /usr/local/bin/
          
          echo "Verifying installations:"
          inso --version
          deck version

      - name: Generate Kong Config from OpenAPI
        run: |
          echo "Converting OpenAPI to kong.yaml using decK..."
          deck file openapi2kong --spec ./open-api.yaml --output-file kong.yaml

      - name: Validate Kong Config
        run: |
          echo "Validating kong.yaml (offline)..."
          deck file validate kong.yaml

      - name: Preview Changes (diff)
        run: |
          echo "Comparing local kong.yaml to Konnect Cloud..."
          deck gateway diff kong.yaml \
            --konnect-token "${{ secrets.KONNECT_TOKEN }}" \
            --konnect-control-plane-name "${{ secrets.KONNECT_CP_NAME }}"

      - name: Deploy to Konnect (sync)
        run: |
          echo "Pushing configuration to Konnect..."
          deck gateway sync kong.yaml \
            --konnect-token "${{ secrets.KONNECT_TOKEN }}" \
            --konnect-control-plane-name "${{ secrets.KONNECT_CP_NAME }}"
