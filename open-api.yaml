openapi: 3.0.0
info:
  title: Client Test API
  description: A simple API to test bbb the Konnect automation pipeline.
  version: 1.0.0
servers:
  - url: http://httpbin.konghq.com
x-kong-route-defaults:
  strip_path: false
paths:
  /users:
    get:
      summary: Get a list of users
      operationId: getUsers
      responses:
        '200':
          description: A successful response
    post:
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: User created successfully
